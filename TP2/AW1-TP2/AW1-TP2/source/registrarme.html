<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>consultorio R2 - Registrarme</title>
</head>
<body>

    <header>
        <a href="./index.html">
            <img src="./img/diente.svg" alt="logotipo clinica"> <!--Poner foto de algun diente-->
        </a>
    </header>

    <main>
        <h1>Crear cuenta nueva</h1>

        <form action="./index.html" method="post">
            <label for="id-nombre">Nombre</label>
            <input type="text" name="nombre" id="id-nombre">

            <label for="id-apellido">Apellido</label>
            <input type="text" name="apellido" id="id-apellido">

            <label for="id-dni">DNI</label>
            <input type="text" name="dni" id="id-dni">

            <label for="id-obra-social">Obra social</label>
            <input type="text" name="obra_social" id="id-obra-social">

            <label for="id-telefono">Telefono</label>
            <input type="tel" name="telefono" id="id-telefono">

            <label for="id-correo">Correo electronico</label>
            <input type="email" name="correo" id="id-correo">

            <label for="id-password">Contraseña</label>
            <input type="password" name="password" id="id-password">

            <label for="id-password-confirmar">Confirmar contraseña</label>
            <input type="password" name="password_confirmar" id="id-password-confirmar">

            <button type="submit">Registrarme</button>
            <button type="button" onclick="history.back()">Volver atras</button>
        </form>
    </main>

    <footer>
        <ul>
            <li>
                <a href="https://instagram.com/@consultorioR2" target="_blank">
                    @consultorioR2
                </a>
            </li>
        </ul>
    </footer>

</body>
</html>
