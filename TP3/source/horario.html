<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>consultorio R2</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>

    <header class="cabecera-principal">
        <nav class="menu-principal">
            <a class="enlace-inicio" href="./index.html">
                <img class="logotipo" src="./img/diente.svg" alt="logotipo clinica"> 
            </a>
            <a href="./notificaciones.html">
                <img class="icono" src="./img/correo.svg" alt="correo notificaciones"> 
            <a href="./configuraciones.html">
                <img class="icono" src="./img/engranaje.svg" alt="menu lateral configuraciones"> 
            </a>        
        </nav>
    </header>

    <main class="contenido-principal">

        <h1>Selecciona un horario de los disponibles</h1>

        <form class="formulario-seleccion" action="./resumen.html" method="post">

            
            <ul class="lista-horarios">    
                <li>
                    <span class="dia">VIERNES</span>
                    <input type="radio" name="turno" id="id-viernes10" value="viernes10">
                    <label for="id-viernes10">10:00h</label>
                    <input type="radio" name="turno" id="id-viernes15" value="viernes15">
                    <label for="id-viernes15">15:00h</label>
                </li>    

                <li>
                    <span class="dia">LUNES</span>
                    <input type="radio" name="turno" id="id-lunes10" value="lunes10">
                    <label for="id-lunes10">10:00h</label>
                    <input type="radio" name="turno" id="id-lunes15" value="lunes15">
                    <label for="id-lunes15">15:00h</label>
                </li>  

                <li>
                    <span class="dia">MIERCOLES</span>
                    <input type="radio" name="turno" id="id-miercoles10" value="miercoles10">
                    <label for="id-miercoles10">10:00h</label>
                    <input type="radio" name="turno" id="id-miercoles15" value="miercoles15">
                    <label for="id-miercoles15">15:00h</label>
                </li>  
                
            </ul>

            <button type="submit">CONTINUAR</button>
        </form>

    </main>
    
    <footer class="pie-principal">
        <ul class="redes-sociales">
            <li>
                <a href="https://instagram.com/@consultorioR2" target="_blank">
                    @consultorioR2
                </a>
            </li>
        </ul>
    </footer>
</body>
</html>
